<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TrafficSense traffic management dashboard — standalone HTML website"
    />
    <title>TrafficSense · Intersection control</title>
    <style>
      :root {
        font-family: "DM Sans", sans-serif;
        color: #253b32;
        background: #f6f8f7;
        font-size: 13px;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      a,

      select {

      }
      button,
      a {

          color 0.15s;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #7dbb9e;
        outline-offset: 3px;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      button svg {
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3,
      .brand {
        font-family: "Manrope", sans-serif;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
        font-weight: 750;
        line-height: 1.4;
      }

      }

      .brand {

        font-weight: 800;

      .brand-icon {

      .nav-label {

        background: #f3f7f4;

      }
      nav b {

      }
      .side-bottom {

        padding: 15px 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .demo-note p {

        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
      }
      .user strong {
        font-size: 10px;

      }
      .user small {

        color: #9aa59d;

      }
      .user > svg {

      .divider {

        font-weight: 550;

      }
      .button:hover {

      }
      .button.primary {

      }

        background: #174c34;
      }
      .badge {

        padding: 5px 8px;
        border-radius: 4px;
        background: #edf6ef;
        color: #4e7f5b;
        font-size: 9px;
        font-weight: 550;

      }
      .badge i {
        width: 4px;
        height: 4px;
        border-radius: 50%;

      }
      .badge.amber {
        background: #fbf3df;
        color: #9d813c;
        border: 1px solid #ede3c7;
      }
      .badge.neutral {
        color: #8a978e;
        background: #f0f3f1;
      }
      .workflow {
        display: flex;
        gap: 14px;
        align-items: center;
        border: 1px solid #e2e8e3;
        border-radius: 7px;
        background: #fff;
        padding: 11px 16px;
        margin-bottom: 24px;
        color: #aab4ad;
        font-size: 10px;
      }
      .workflow button {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #8f9d94;
        font-size: 10px;
      }
      .workflow button > span {
        border: 1px solid #dfe6e0;
        width: 18px;
        height: 18px;
        border-radius: 50%;

        align-items: center;
        justify-content: center;
        font-size: 8px;
      }
      .workflow button.current {
        color: #2e6044;
        font-weight: 600;
      }
      .workflow button.current > span {
        background: #2c6145;
        color: white;
        border: 0;
      }
      .workflow-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 9px;
      }
      .workflow-end i {
        width: 3px;
        height: 3px;
        background: #acb6af;
        border-radius: 50%;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 17px;
        margin-bottom: 27px;
      }
      .stat {
        background: #fff;
        border: 1px solid #e0e7e1;
        border-radius: 8px;
        padding: 17px 18px 15px;
      }
      .stat > div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #7c8a80;
        font-size: 11px;
      }
      .stat-icon {
        color: #86a590;
        background: #f1f6f2;
        border-radius: 6px;
        display: flex;
        padding: 7px;
      }
      .stat > strong {
        font-family: Manrope, sans-serif;
        display: block;
        font-size: 27px;
        font-weight: 750;
        letter-spacing: -0.9px;
        margin-top: 1px;
        color: #304a39;
      }
      .stat p {
        font-size: 9px;
        margin-top: 5px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 317px;
        gap: 23px;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 17px;
      }
      .section-title p {
        font-size: 10px;
        margin-top: 5px;
      }
      .number {
        font-size: 9px;
        font-family: "DM Sans";
        background: #e9efeb;
        color: #85998b;
        border-radius: 4px;
        padding: 3px 5px;
        font-weight: 500;
        margin-left: 3px;
      }
      .controls {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .controls button {
        background: #fff;
        border: 1px solid #e1e7e3;
        border-radius: 4px;
        padding: 7px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: #87958a;
        font-size: 9px;
      }
      .controls .start {
        background: #295c43;
        color: white;
        border-color: #295c43;
        padding: 7px 10px;
      }
      .run-state {
        font-size: 9px;
        color: #9ca89f;
        margin-right: 4px;
      }
      .run-state.running {
        color: #33976a;
      }
      .camera-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
      }
      .camera-card {
        overflow: hidden;
        border-radius: 7px;
        border: 1px solid #dfe6e1;
        background: #fff;
      }
      .camera-top {
        display: flex;
        align-items: center;
        padding: 11px 12px;
        gap: 10px;
      }
      .camera-top strong {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
      }
      .direction {
        display: flex;
        color: #77937e;
      }
      .camera-top > button {
        margin-left: auto;
        color: #95a399;
        display: flex;
      }
      .feed-status {
        font-size: 8px;
        color: #85958a;
        display: flex;
        gap: 4px;
        align-items: center;
        margin-left: auto;
      }
      .feed-status i {
        width: 4px;
        height: 4px;
        background: #78a684;
        border-radius: 50%;
      }
      .feed {
        aspect-ratio: 1.78;
        position: relative;
        background: #26362d;
        overflow: hidden;
      }
      .feed > img,
      .feed > video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.55) brightness(0.8);
      }
      .feed-0 > img {
        object-position: center 65%;
      }
      .feed-1 > img {
        object-position: center 70%;
      }
      .feed-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(#0003, transparent 40%, #0003);
        pointer-events: none;
      }
      .feed-id {
        position: absolute;
        left: 10px;
        top: 11px;
        color: #fff;
        font-family: monospace;
        font-size: 7px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .feed-id i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #96d9b0;
      }
      .feed-time {
        position: absolute;
        right: 10px;
        top: 11px;
        color: #fff9;
        font-family: monospace;
        font-size: 7px;
      }
      .detection {
        position: absolute;
        border: 1px solid #9ade73;
        box-shadow: 0 0 0 0.5px #c1f6993d;
      }
      .detection span {
        position: absolute;
        left: -1px;
        top: -10px;
        font-size: 6px;
        background: #aad88e;
        color: #263f20;
        padding: 1px 4px;
      }
      .expand {
        position: absolute;
        right: 9px;
        bottom: 9px;
        color: white;
        background: #0005;
        padding: 4px;
        border-radius: 3px;
        display: flex;
      }
      .camera-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 12px;
        font-size: 9px;
        color: #93a096;
      }
      .camera-footer strong {
        color: #3a5141;
        font-size: 17px;
        margin-right: 4px;
      }
      .camera-footer > span:last-child {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 8px;
      }
      .camera-footer b {
        font-size: 8px;
        font-weight: 500;
        text-transform: capitalize;
      }
      .camera-footer .green {
        color: #539a6f;
      }
      .camera-footer .red {
        color: #bc8179;
      }
      .signal {
        display: inline-flex;
        gap: 3px;
        padding: 4px;
        background: #2c3730;
        border-radius: 5px;
      }
      .signal i {
        width: 5px;
        height: 5px;
        background: #566057;
        border-radius: 50%;
      }
      .signal .red {
        background: #e99481;
        box-shadow: 0 0 4px #d77b64;
      }
      .signal .green {
        background: #85c99b;
        box-shadow: 0 0 4px #8bc69d;
      }
      .signal .yellow {
        background: #f6d269;
      }
      .calibration-strip {
        border-top: 1px solid #f0f2f0;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 12px;
        font-size: 8px;
        color: #9aa69e;
      }
      .calibration-strip button {
        margin-left: auto;
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 8px;
        color: #6e8b77;
      }
      .saved-dot,
      .neutral-dot,
      .green-dot,
      .red-dot,
      .amber-dot {
        width: 5px;
        height: 5px;
        display: inline-block;
        border-radius: 50%;
        background: #b4bdb6;
        flex-shrink: 0;
      }
      .saved-dot,
      .green-dot {
        background: #65a77d;
      }
      .red-dot {
        background: #d69788;
      }
      .amber-dot {
        background: #d0ae67;
      }
      .feed-footnote {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 8px;
        color: #9aa69e;
        margin-top: 13px;
      }
      .feed-footnote > span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .small-square {
        width: 6px;
        height: 6px;
        border: 1px solid #9fc38b;
      }
      .recommendation {
        background: white;
        border: 1px solid #dae4dc;
        border-radius: 8px;
        overflow: hidden;
        align-self: start;
        margin-top: 0;
      }
      .recommendation-title {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 17px 15px;
        border-bottom: 1px solid #e9eeea;
      }
      .recommendation-title h2 {
        font-size: 12px;
      }
      .recommendation-title > .badge {
        margin-left: auto;
        font-size: 8px;
      }
      .ai-icon {
        color: #789a80;
        display: flex;
      }
      .recommendation-main {
        padding: 21px 19px 17px;
      }
      .recommendation-main .eyebrow {
        font-size: 8px;
        color: #8d9e91;
        letter-spacing: 1.1px;
      }
      .green-road {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-top: 15px;
      }
      .green-road > span:first-child {
        padding: 11px;
        background: #edf5ee;
        color: #598465;
        border-radius: 9px;
        display: flex;
      }
      .green-road h3 {
        font-size: 24px;
        color: #2d5b3e;
        letter-spacing: -0.8px;
      }
      .green-road p {
        font-size: 9px;
      }
      .green-road .large {
        width: 9px;
        height: 9px;
        box-shadow: 0 0 0 5px #f0f7f1;
        margin-left: auto;
        margin-right: 4px;
      }
      .recommendation-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin: 23px 0 18px;
      }
      .recommendation-metrics > div + div {
        border-left: 1px solid #e6ece7;
        padding-left: 22px;
      }
      .recommendation-metrics span {
        display: block;
        font-size: 9px;
        color: #8d9b91;
      }
      .recommendation-metrics strong {
        font-family: Manrope;
        font-size: 27px;
        font-weight: 700;
        display: block;
        margin-top: 5px;
        color: #3c5643;
      }
      .recommendation-metrics small {
        font-size: 10px;
        color: #8c9c8f;
        font-family: "DM Sans";
        font-weight: 400;
      }
      .reason {
        background: #f5f8f4;
        border: 1px solid #e9eee7;
        border-radius: 6px;
        padding: 12px 10px;
        display: flex;
        gap: 7px;
        color: #8da58e;
      }
      .reason > svg {
        flex-shrink: 0;
      }
      .reason strong {
        font-size: 9px;
        color: #69846c;
      }
      .reason p {
        font-size: 9px;
        margin-top: 5px;
        line-height: 1.7;
        color: #91a08f;
      }
      .intersection-map {
        height: 176px;
        position: relative;
        background: #fafbf8;
        overflow: hidden;
        margin: 0 19px;
        border: 1px solid #eef1e9;
        border-radius: 5px;
      }
      .map-road {
        position: absolute;
        background: #e8ece5;
      }
      .map-road.vertical {
        left: calc(50% - 29px);
        width: 58px;
        top: 0;
        bottom: 0;
      }
      .map-road.horizontal {
        top: calc(50% - 29px);
        height: 58px;
        left: 0;
        right: 0;
      }
      .map-dash {
        position: absolute;
        border-color: #fff;
      }
      .map-dash.v {
        height: 100%;
        left: 50%;
        border-left: 2px dashed white;
      }
      .map-dash.h {
        width: 100%;
        top: 50%;
        border-top: 2px dashed white;
      }
      .map-center {
        position: absolute;
        left: calc(50% - 23px);
        top: calc(50% - 23px);
        background: #c4dbc7;
        border: 1px solid #a4c5ab;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 6px;
        color: #649773;
      }
      .crossing {
        position: absolute;
        width: 58px;
        height: 9px;
        background: repeating-linear-gradient(
          90deg,
          #fff9 0 4px,
          transparent 4px 7px
        );
        left: calc(50% - 29px);
      }
      .c1 {
        top: 43px;
      }
      .c2 {
        bottom: 43px;
      }
      .intersection-map > span {
        position: absolute;
        font-size: 7px;
        letter-spacing: 1px;
        color: #a3afa0;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .map-front {
        left: calc(50% - 20px);
        top: 12px;
      }
      .map-back {
        left: calc(50% - 16px);
        bottom: 12px;
      }
      .map-left {
        left: 12px;
        top: calc(50% - 3px);
      }
      .map-right {
        right: 10px;
        top: calc(50% - 3px);
      }
      .hardware-callout {
        display: flex;

    <!-- Python backend connection: change the API URL below when your backend is available.
     Demo mode works without a server, internet connection, or installation. -->
    <script>
      // Set this to the Python API root before connecting live data.
      window.TRAFFICSENSE_API_URL = "/api";
    </script>
    <script>
      /* Python backend adapter. All detection boxes and calibration points use 0–1 coordinates. */
      window.TrafficSenseAPI = (() => {
        const base = () =>
          (window.TRAFFICSENSE_API_URL || "/api").replace(/\/$/, "");
        async function request(path, method = "GET", body) {
          const response = await fetch(base() + path, {
            method,
            headers: { "Content-Type": "application/json" },
            ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok)
            throw new Error(`Backend request failed (${response.status}).`);
          if (
            !response.headers.get("content-type")?.includes("application/json")
          )
            throw new Error(
              "Python backend is not connected. Check the API URL in config.js.",
            );
          return response.json();
        }
        return {
          snapshot: () => request("/snapshot"),
          geometry: () => request("/calibration/geometry"),
          calibrate: (road, markings) =>
            request(`/cameras/${road.toLowerCase()}/calibration`, "PUT", {
              markings,
            }),
          connect: (road, url) =>
            request(`/cameras/${road.toLowerCase()}/connect`, "POST", { url }),
          upload: async (road, file) => {
            const body = new FormData();
            body.append("video", file);
            const r = await fetch(
              base() + `/cameras/${road.toLowerCase()}/video`,
              { method: "POST", body },
            );
            if (!r.ok) throw new Error(`Video upload failed (${r.status}).`);
            return r.json();
          },
          control: (action) => request("/control", "POST", { action }),
          priority: (road) =>
            request("/priority", "POST", { road, source: "manual" }),
          serial: (port) => request("/hardware/connect", "POST", { port }),
          review: (incident) =>
            request(
              `/incidents/${encodeURIComponent(incident.id)}`,
              "PATCH",
              incident,
            ),
        };
      })();
    </script>

 class="small">${esc(state.demo ? state.phase : d.clearancePhase || "Awaiting controller state")}</p><div class="phase-list">${["Yellow clearance", "All-red clearance", "Green phase"].map((p, i) => `<div class="${(state.demo ? state.phase : d.clearancePhase || "").toLowerCase().includes(p.split(" ")[0].toLowerCase()) ? "selected" : ""}"><span>${i + 1}</span>${p}</div>`).join("")}</div><h3>Queued requests (${state.demo ? state.queue.length : d.priorityRequests?.length || 0})</h3>${state.demo ? (state.queue.length ? state.queue.map((r, i) => `<div class="queue-row">${r} road ${badge(i === 0 ? state.phase : "Queued", "amber")}</div>`).join("") : "<p>No priority requests in queue.</p>") : d.priorityRequests?.length ? d.priorityRequests.map((r) => `<div class="queue-row">${esc(r.road)} road ${badge(r.status, "amber")}</div>`).join("") : "<p>No priority requests received.</p>"}</section></div>`;

            const road = button.dataset.connect,
              url = state.urls[road]?.trim();
            if (!url) {
              notify("Enter a camera stream URL first.", true);
              return;
            }
            await action(
              () => TrafficSenseAPI.connect(road, url),
              "Feed connection requested. Connection status will come from the backend.",
            );
            return;
          }
          switch (button.dataset.action) {
            case "unlinked-feeds":
              window.alert("No arduino linked");
              break;
            case "mode":
              liveGeometryLoaded = false;
              await switchMode();
              break;
            case "location":
              notify(
                "Active location: Pitampura Intersection · Intersection INT-004.",
              );
              break;
            case "help":
              notify(
                "Workflow: calibrate each camera, connect feeds, start analysis, then review recommendations. Set the Python API root in config.js. Configure your Python backend URL near the top of this HTML file.",
              );
              break;
            case "priority":
              if (state.demo) {
                state.queue.push(state.priority);
                if (state.queue.length === 1) startPriority();
                else render();
              } else
                await action(
                  () => TrafficSenseAPI.priority(state.priority),
                  "Priority requested. Waiting for clearance and controller acknowledgement.",
                );
              break;
            case "serial":
              if (!state.port.trim())
                notify("Enter a serial port first.", true);
              else
                await action(
                  () => TrafficSenseAPI.serial(state.port.trim()),
                  "Connection requested. Waiting for hardware acknowledgement.",
                );
              break;
            case "clear-incidents":
              state.data.incidents = [];
              state.filter = "All incidents";
              render();
              notify("All displayed incident records cleared.");
              break;
            case "export":
              exportCSV();
              break;
            case "close-modal":
              closeModal();
              break;
            case "undo": {
              const m = modalState;
              m.marks[m.selected] = (m.marks[m.selected] || []).slice(0, -1);
              renderModal();
              break;
            }
            case "reset":
              modalState.marks = {};
              renderModal();
              break;
            case "add-point": {
              const x = Number($("#point-x").value),
                y = Number($("#point-y").value);
              if (
                !Number.isFinite(x) ||
                !Number.isFinite(y) ||
                x < 0 ||
                x > 1 ||
                y < 0 ||
                y > 1
              )
                modalError("Enter coordinates between 0 and 1.");
              else addPoint(x, y);
              break;
            }
            case "save-calibration":
              if (!button.disabled) saveCalibration();
              break;
          }
        });
        app.addEventListener("input", (e) => {
          if (e.target.dataset.url)
            state.urls[e.target.dataset.url] = e.target.value;
          if (e.target.id === "serial-port") state.port = e.target.value;
          if (e.target.id === "plate-number" && modalState?.record)
            modalState.record.plate = e.target.value;
        });
        app.addEventListener("change", async (e) => {
          const el = e.target;
          if (el.id === "priority-road") state.priority = el.value;
          if (el.dataset.video && el.files[0]) {
            const road = el.dataset.video,
              file = el.files[0];
            if (!file.type.startsWith("video/")) {
              notify("Select a video file.", true);
              return;
            }
            if (!state.demo) {
              const generation = pollGeneration;
              uploadsInFlight++;
              el.blur();
              try {
                await action(async () => {
                  await TrafficSenseAPI.upload(road, file);
                  if (generation !== pollGeneration || state.demo) return;
                  if (state.sources[road]) {
                    URL.revokeObjectURL(state.sources[road].url);
                    delete state.sources[road];
                  }
                  delete state.cal[road];
                }, "Video uploaded. Press Start to analyse the loaded roads.");
              } finally {
                uploadsInFlight--;
                el.value = "";
                if (generation === pollGeneration && !state.demo) {
                  clearTimeout(pollTimer);
                  const next = ++pollGeneration;
                  await poll(next);
                }
              }
              return;
            }
            if (state.sources[road])
              URL.revokeObjectURL(state.sources[road].url);
            state.sources[road] = { url: URL.createObjectURL(file), time: 0 };
            const cam = state.data.cameras.find((c) => c.road === road);
            cam.count = 0;
            cam.signal = "unknown";
            cam.status = "Local demo video";
            cam.detections = [];
            state.data.recommendation = null;
            state.notice = `${road} video loaded locally. Pause a frame and select Capture frame & calibrate. Demo videos are not AI-processed.`;
            render();
          }
          if (el.id === "reference-frame" && el.files[0]) {
            if (!el.files[0].type.startsWith("image/")) return;
            modalState.frame = URL.createObjectURL(el.files[0]);
            modalState.marks = {};
            renderModal();
          }
        });
        document.addEventListener("keydown", (e) => {
          if (!modalState) return;
          if (e.key === "Escape") {
            closeModal();
            return;
          }
          if (e.key === "Tab") {
            const nodes = $$(
              'button:not(:disabled),input,select,[tabindex="0"]',
              $(".modal"),
            );
            const first = nodes[0],
              last = nodes.at(-1);
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        });
        app.addEventListener(
          "error",
          (e) => {
            if (e.target.tagName === "IMG") {
              e.target.style.display = "none";
              const fallback = document.createElement("span");
              fallback.className = "image-error";
              fallback.textContent = "Frame unavailable";
              e.target.after(fallback);
            }
          },
          true,
        );
        window.addEventListener("beforeunload", () => {
          clearTimeout(pollTimer);
          clearPhases();
          Object.values(state.sources).forEach((s) =>
            URL.revokeObjectURL(s.url),
          );
        });
        render();
      })();
    </script>
  </body>
</html>
